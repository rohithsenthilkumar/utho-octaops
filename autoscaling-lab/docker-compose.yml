services:
  gateway:
    image: nginx:alpine
    container_name: smartcloud-gateway
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    restart: always

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: smartcloud-demo-workload:latest
    deploy:
      replicas: 1
    restart: always
