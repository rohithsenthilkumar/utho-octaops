events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/json;

    # Docker embedded DNS resolver (valid 2s to dynamically track replica scaling)
    resolver 127.0.0.11 valid=2s ipv6=off;

    server {
        listen 80;

        location / {
            set $upstream_backend http://app:8000;
            proxy_pass $upstream_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            add_header X-LB-Handler "smartcloud-nginx-gateway" always;
            add_header X-Upstream-Addr $upstream_addr always;
        }

        location /health {
            set $upstream_backend http://app:8000;
            proxy_pass $upstream_backend/health;
            proxy_set_header Host $host;
            add_header X-LB-Handler "smartcloud-nginx-gateway" always;
            add_header X-Upstream-Addr $upstream_addr always;
        }

        location /work {
            set $upstream_backend http://app:8000;
            proxy_pass $upstream_backend/work$is_args$args;
            proxy_set_header Host $host;
            add_header X-LB-Handler "smartcloud-nginx-gateway" always;
            add_header X-Upstream-Addr $upstream_addr always;
        }
    }
}
